name: Testy i obraz Docker GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Testy aplikacji
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    name: Zbuduj i opublikuj obraz
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Zbuduj obraz do testu
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: szkolnyalert:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sprawdź kontener i trwałość danych JSON
        run: bash scripts/container-smoke.sh
      - name: Zaloguj do GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Opublikuj obraz AMD64 i ARM64
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mdriverpl/szkolnyalert:latest
            ghcr.io/mdriverpl/szkolnyalert:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mdriverpl/szkolnyalert
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
